<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkPing API Tester</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
#sidebar{width:320px;min-width:320px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
#sidebar-header h1{font-size:18px;margin-bottom:8px}
#sidebar-header input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
#sidebar-header input:focus{border-color:var(--accent)}
#base-url-row{display:flex;gap:6px;margin-bottom:8px}
#base-url{flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--accent);font-size:12px;font-family:monospace;outline:none}
#route-list{flex:1;overflow-y:auto;padding:8px}
.route-group{margin-bottom:4px}
.route-group-header{padding:8px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.route-group-header:hover{color:var(--text)}
.route-group-header .arrow{transition:transform .2s}
.route-group.collapsed .arrow{transform:rotate(-90deg)}
.route-group.collapsed .route-group-items{display:none}
.route-item{padding:6px 12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:13px;margin:1px 0}
.route-item:hover{background:var(--bg)}
.route-item.active{background:var(--bg);border:1px solid var(--border)}
.method-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;min-width:42px;text-align:center;font-family:monospace}
.method-GET{background:#1a3a2a;color:var(--green)}
.method-POST{background:#1a2a3a;color:var(--accent)}
.method-PUT{background:#2a2a1a;color:var(--orange)}
.method-DELETE{background:#2a1a1a;color:var(--red)}
.route-path{font-family:monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-dot{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0}
.auth-dot.locked{background:var(--orange)}
.auth-dot.open{background:var(--green)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#request-bar{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--surface)}
#req-method{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--green);font-weight:700;font-size:13px;font-family:monospace;outline:none;cursor:pointer}
#req-url{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:13px;outline:none}
#req-url:focus{border-color:var(--accent)}
#send-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
#send-btn:hover{opacity:.9}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
#content{flex:1;display:flex;overflow:hidden}
#request-panel,#response-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#request-panel{border-right:1px solid var(--border)}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;background:var(--surface)}
.panel-tab{padding:4px 12px;font-size:12px;cursor:pointer;border-radius:4px;color:var(--muted);font-weight:600}
.panel-tab.active{background:var(--bg);color:var(--text)}
.panel-body{flex:1;overflow-y:auto;padding:16px}
.field-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.field-row input,.field-row select{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;font-family:monospace;outline:none}
.field-row input:focus{border-color:var(--accent)}
.field-key{width:160px}
.field-val{flex:1}
.field-type{width:80px;color:var(--muted);font-size:11px}
.field-req{color:var(--red);font-size:10px;font-weight:700}
.field-opt{color:var(--muted);font-size:10px}
#response-body{white-space:pre-wrap;font-family:monospace;font-size:13px;line-height:1.6;color:var(--text)}
.status-badge{padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700;font-family:monospace;margin-left:auto}
.status-2xx{background:#1a3a2a;color:var(--green)}
.status-4xx{background:#2a2a1a;color:var(--orange)}
.status-5xx{background:#2a1a1a;color:var(--red)}
.empty-state{color:var(--muted);text-align:center;padding:40px;font-size:14px}
textarea{width:100%;min-height:200px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:13px;resize:vertical;outline:none;line-height:1.5}
textarea:focus{border-color:var(--accent)}
.info-text{font-size:11px;color:var(--muted);margin-bottom:12px}
.timer{font-size:12px;color:var(--muted);font-family:monospace}
#response-header-bar{display:flex;align-items:center;gap:12px}
.desc-block{padding:12px;background:var(--bg);border-radius:6px;margin-bottom:16px;border:1px solid var(--border)}
.desc-block h3{font-size:13px;margin-bottom:4px}
.desc-block p{font-size:12px;color:var(--muted)}
label.cb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.cb input{accent-color:var(--accent)}
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h1>WorkPing API Tester</h1>
    <div id="base-url-row">
      <input id="base-url" value="http://localhost:3000" placeholder="Base URL">
    </div>
    <input id="search" placeholder="Search routes..." oninput="filterRoutes(this.value)">
  </div>
  <div id="route-list"></div>
</div>
<div id="main">
  <div id="request-bar">
    <select id="req-method">
      <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
    </select>
    <input id="req-url" placeholder="/api/..." readonly>
    <span class="timer" id="timer"></span>
    <button id="send-btn" onclick="sendRequest()">Send</button>
  </div>
  <div id="content">
    <div id="request-panel">
      <div class="panel-header">
        <div class="panel-tab active" data-tab="body" onclick="switchReqTab(this)">Body</div>
        <div class="panel-tab" data-tab="query" onclick="switchReqTab(this)">Query</div>
        <div class="panel-tab" data-tab="params" onclick="switchReqTab(this)">URL Params</div>
        <div class="panel-tab" data-tab="info" onclick="switchReqTab(this)">Info</div>
      </div>
      <div class="panel-body" id="req-body-panel"></div>
    </div>
    <div id="response-panel">
      <div class="panel-header" id="response-header-bar">
        <div class="panel-tab active">Response</div>
        <span class="status-badge" id="resp-status" style="display:none"></span>
      </div>
      <div class="panel-body">
        <pre id="response-body"><span class="empty-state">Select a route and click Send</span></pre>
      </div>
    </div>
  </div>
</div>

<script>
const ROUTES = [
  // ── CENTRAL ──
  {group:"Central",method:"GET",path:"/verify-cookie",auth:false,body:[],query:[],params:[],desc:"Verify JWT cookie and return user profile"},

  // ── OAUTH ──
  {group:"OAuth",method:"GET",path:"/auth/google/start",auth:false,body:[],query:[],params:[],desc:"Redirect to Google OAuth (opens in browser)"},
  {group:"OAuth",method:"GET",path:"/auth/microsoft/start",auth:false,body:[],query:[],params:[],desc:"Redirect to Microsoft OAuth (opens in browser)"},

  // ── ADMIN AUTH ──
  {group:"Admin Auth",method:"POST",path:"/api/admin/auth/register",auth:false,body:[
    {key:"name",type:"string",req:true},{key:"email",type:"string",req:true},{key:"password",type:"string",req:true},{key:"number",type:"string",req:true,hint:"Phone number"}

  {group:"Admin Auth",method:"POST",path:"/api/admin/auth/login",auth:false,body:[
    {key:"email",type:"string",req:true},{key:"password",type:"string",req:true}
  ],query:[],params:[],desc:"Admin login — sets accessToken cookie"},
  {group:"Admin Auth",method:"POST",path:"/api/admin/auth/logout",auth:false,body:[],query:[],params:[],desc:"Clear accessToken cookie"},
  {group:"Admin Auth",method:"POST",path:"/api/admin/auth/forgot-password/send-otp",auth:false,body:[
    {key:"email",type:"string",req:true}
  ],query:[],params:[],desc:"Send OTP to admin email"},
  {group:"Admin Auth",method:"POST",path:"/api/admin/auth/forgot-password/verify-otp",auth:false,body:[
    {key:"email",type:"string",req:true},{key:"otp",type:"string",req:true}

  {group:"Admin Auth",method:"POST",path:"/api/admin/auth/forgot-password/reset",auth:false,body:[

  ],query:[],params:[],desc:"Reset password after OTP verification"},

  // ── ADMIN OTP ──
  {group:"Admin OTP",method:"POST",path:"/api/otp/send-email-otp",auth:false,body:[{key:"email",type:"string",req:true}],query:[],params:[],desc:"Send email OTP during registration"},
  {group:"Admin OTP",method:"POST",path:"/api/otp/verify-email-otp",auth:false,body:[{key:"email",type:"string",req:true},{key:"otp",type:"string",req:true}],query:[],params:[],desc:"Verify email OTP"},
  {group:"Admin OTP",method:"POST",path:"/api/otp/send-phone-otp",auth:false,body:[{key:"phone",type:"string",req:true}],query:[],params:[],desc:"Send phone OTP (placeholder)"},
  {group:"Admin OTP",method:"POST",path:"/api/otp/verify-phone-otp",auth:false,body:[{key:"phone",type:"string",req:true},{key:"otp",type:"string",req:true}],query:[],params:[],desc:"Verify phone OTP (placeholder)"},

  // ── ADMIN FORGOT PASSWORD ──
  {group:"Admin Forgot Password",method:"POST",path:"/api/admin/forgot-password/send-otp",auth:false,body:[{key:"email",type:"string",req:true}],query:[],params:[],desc:"Send password reset OTP"},
  {group:"Admin Forgot Password",method:"POST",path:"/api/admin/forgot-password/verify-otp",auth:false,body:[{key:"email",type:"string",req:true},{key:"otp",type:"string",req:true}],query:[],params:[],desc:"Verify password reset OTP"},
  {group:"Admin Forgot Password",method:"POST",path:"/api/admin/forgot-password/verify-and-change",auth:false,body:[{key:"email",type:"string",req:true},{key:"otp",type:"string",req:true},{key:"newPassword",type:"string",req:true}],query:[],params:[],desc:"Verify OTP and change password"},

  // ── ADMIN PROFILE ──
  {group:"Admin Profile",method:"GET",path:"/api/admin/profile",auth:true,body:[],query:[],params:[],desc:"Get authenticated admin's profile"},
  {group:"Admin Profile",method:"GET",path:"/api/admin/profile/by-email",auth:true,body:[],query:[{key:"email",type:"string",req:true}],params:[],desc:"Get admin profile by email"},
  {group:"Admin Profile",method:"PUT",path:"/api/admin/profile",auth:true,body:[
    {key:"name",type:"string",req:false},{key:"phoneNumber",type:"string",req:false}
  ],query:[],params:[],desc:"Update admin's profile"},
  {group:"Admin Profile",method:"PUT",path:"/api/admin/profile/change-password",auth:true,body:[
    {key:"currentPassword",type:"string",req:true},{key:"newPassword",type:"string",req:true}
  ],query:[],params:[],desc:"Change admin's password"},

  // ── ADMIN ORGANIZATION ──
  {group:"Admin Organization",method:"GET",path:"/api/admin/organization/get-organizations",auth:true,body:[],query:[
    {key:"search",type:"string",req:false},{key:"page",type:"number",req:false,hint:"default: 1"},{key:"limit",type:"number",req:false,hint:"default: 10"}
  ],params:[],desc:"Get paginated organizations for admin"},
  {group:"Admin Organization",method:"GET",path:"/api/admin/organization/get-organization-by-id/:id",auth:true,body:[],query:[],params:[{key:"id",type:"ObjectId",req:true}],desc:"Get single organization by ID"},
  {group:"Admin Organization",method:"GET",path:"/api/admin/organization/get-all-organization-ids",auth:true,body:[],query:[],params:[],desc:"Get all org IDs with names"},
  {group:"Admin Organization",method:"POST",path:"/api/admin/organization/add-organization",auth:true,body:[
    {key:"name",type:"string",req:true},{key:"type",type:"string",req:false},{key:"description",type:"string",req:false},{key:"clDays",type:"number",req:false,hint:"default: 12"},{key:"foundedAt",type:"date",req:false}
  ],query:[],params:[],desc:"Create a new organization"},
  {group:"Admin Organization",method:"POST",path:"/api/admin/organization/update-organization",auth:true,body:[
    {key:"_id",type:"ObjectId",req:true},{key:"name",type:"string",req:false},{key:"type",type:"string",req:false},{key:"description",type:"string",req:false}
  ],query:[],params:[],desc:"Update organization details"},
  {group:"Admin Organization",method:"POST",path:"/api/admin/organization/delete-organizations",auth:true,body:[
    {key:"data",type:"array",req:true,hint:'["orgId1","orgId2"]'}
  ],query:[],params:[],desc:"Delete organization(s) — pass array of IDs in data field"},

  // ── ADMIN TEAM ──
  {group:"Admin Team",method:"POST",path:"/api/admin/team/create-team",auth:true,body:[
    {key:"teamName",type:"string",req:true},{key:"organizationId",type:"ObjectId",req:true},{key:"teamManagerId",type:"ObjectId",req:false},{key:"description",type:"string",req:false},{key:"teamLeaderIds",type:"array",req:false,hint:"Array of User ObjectIds"}
  ],query:[],params:[],desc:"Create a new team"},
  {group:"Admin Team",method:"GET",path:"/api/admin/team/get-team/:id",auth:true,body:[],query:[],params:[{key:"id",type:"ObjectId",req:true}],desc:"Get single team details"},
  {group:"Admin Team",method:"POST",path:"/api/admin/team/get-all-teams",auth:true,body:[{key:"organizationId",type:"ObjectId",req:true}],query:[],params:[],desc:"Get all teams in organization"},
  {group:"Admin Team",method:"GET",path:"/api/admin/team/get-teams-filter",auth:true,body:[],query:[
    {key:"organizationId",type:"ObjectId",req:false},{key:"page",type:"number",req:false},{key:"limit",type:"number",req:false},{key:"search",type:"string",req:false}
  ],params:[],desc:"Get teams with pagination and search"},
  {group:"Admin Team",method:"POST",path:"/api/admin/team/update-team",auth:true,body:[
    {key:"teamId",type:"ObjectId",req:true},{key:"teamName",type:"string",req:false},{key:"description",type:"string",req:false}
  ],query:[],params:[],desc:"Update team details"},
  {group:"Admin Team",method:"POST",path:"/api/admin/team/delete-team",auth:true,body:[{key:"teamId",type:"ObjectId",req:true}],query:[],params:[],desc:"Delete a team"},
  {group:"Admin Team",method:"POST",path:"/api/admin/team/add-team-member",auth:true,body:[
    {key:"userIds",type:"array",req:true,hint:'["userId1","userId2"]'},{key:"teamId",type:"ObjectId",req:true},{key:"organizationId",type:"ObjectId",req:true},{key:"roleInTeam",type:"string",req:false,hint:"manager|teamLead|member"}
  ],query:[],params:[],desc:"Add member(s) to a team — pass array of userIds"},
  {group:"Admin Team",method:"POST",path:"/api/admin/team/remove-team-member",auth:true,body:[{key:"membershipIds",type:"array",req:true,hint:'["membershipId1","membershipId2"]'}],query:[],params:[],desc:"Remove member(s) from team — pass array of membership IDs"},
  {group:"Admin Team",method:"GET",path:"/api/admin/team/get-team-members",auth:true,body:[],query:[{key:"teamId",type:"ObjectId",req:true}],params:[],desc:"Get all members of a team"},
  {group:"Admin Team",method:"GET",path:"/api/admin/team/get-user-teams",auth:true,body:[],query:[{key:"userId",type:"ObjectId",req:true}],params:[],desc:"Get all teams for a user"},

  // ── ADMIN EMPLOYEES ──
  {group:"Admin Employees",method:"GET",path:"/api/admin/get-all-employees/get-all-employees-by-page-number",auth:true,body:[],query:[
    {key:"search",type:"string",req:false},{key:"organizationId",type:"ObjectId",req:false},{key:"teamId",type:"ObjectId",req:false},{key:"page",type:"number",req:false},{key:"limit",type:"number",req:false}
  ],params:[],desc:"Search and paginate employees"},
  {group:"Admin Employees",method:"GET",path:"/api/admin/get-all-employees/get-organization-info",auth:true,body:[],query:[],params:[],desc:"Get org structure with teams"},
  {group:"Admin Employees",method:"POST",path:"/api/admin/add-employees/by-form",auth:true,body:[
    {key:"userName",type:"string",req:true},{key:"email",type:"string",req:true},{key:"phone",type:"string",req:true},{key:"userId",type:"string",req:true,hint:"Employee ID"},{key:"organizationId",type:"ObjectId",req:true},{key:"doj",type:"date",req:true,hint:"Date of joining"},{key:"gender",type:"string",req:false,hint:"male|female|other"},{key:"salary",type:"number",req:false},{key:"dob",type:"date",req:false},{key:"address",type:"string",req:false},{key:"teamId",type:"ObjectId",req:false},{key:"roleInTeam",type:"string",req:false}
  ],query:[],params:[],desc:"Add single employee via form"},
  {group:"Admin Employees",method:"POST",path:"/api/admin/add-employees/by-excel",auth:true,body:[],query:[],params:[],desc:"Upload employees via Excel file (multipart/form-data, field: file)"},
  {group:"Admin Employees",method:"GET",path:"/api/admin/employee/get-employee/:id",auth:true,body:[],query:[],params:[{key:"id",type:"ObjectId",req:true}],desc:"Get single employee details by ID"},
  {group:"Admin Employees",method:"POST",path:"/api/admin/employee/update",auth:true,body:[
    {key:"employeeId",type:"ObjectId",req:true},{key:"userName",type:"string",req:false},{key:"email",type:"string",req:false},{key:"phone",type:"string",req:false},{key:"userId",type:"string",req:false,hint:"Employee ID"},{key:"gender",type:"string",req:false,hint:"male|female|other"},{key:"salary",type:"number",req:false},{key:"dob",type:"date",req:false},{key:"address",type:"string",req:false},{key:"dateOfJoining",type:"date",req:false},{key:"role",type:"string",req:false,hint:"manager|teamLead|employee"},{key:"isActive",type:"boolean",req:false},{key:"teamId",type:"ObjectId",req:false},{key:"organizationId",type:"ObjectId",req:false},{key:"aadhaar",type:"string",req:false,hint:"12 digits"},{key:"pan",type:"string",req:false,hint:"AAAAA9999A"},{key:"passport",type:"string",req:false,hint:"A1234567"},{key:"bankId",type:"string",req:false}
  ],query:[],params:[],desc:"Update employee details and govt proof fields"},
  {group:"Admin Employees",method:"POST",path:"/api/admin/employees",auth:true,body:[
    {key:"data",type:"array",req:true,hint:'["userId1","userId2"]'}
  ],query:[],params:[],desc:"Delete employee(s) — pass array of user IDs in data field"},

  // ── ADMIN PROJECT ──
  {group:"Admin Project",method:"POST",path:"/api/admin/project/create-project",auth:true,body:[
    {key:"name",type:"string",req:true},{key:"organizationId",type:"ObjectId",req:true},{key:"projectManager",type:"ObjectId",req:true},{key:"description",type:"string",req:false},{key:"dueDate",type:"date",req:false},{key:"contractedBy",type:"string",req:false}
  ],query:[],params:[],desc:"Create a new project"},
  {group:"Admin Project",method:"GET",path:"/api/admin/project/get-projects",auth:true,body:[],query:[
    {key:"organizationId",type:"ObjectId",req:false},{key:"search",type:"string",req:false},{key:"page",type:"number",req:false},{key:"limit",type:"number",req:false}
  ],params:[],desc:"Get all projects with pagination and search"},
  {group:"Admin Project",method:"GET",path:"/api/admin/project/get-project",auth:true,body:[],query:[{key:"projectId",type:"ObjectId",req:true}],params:[],desc:"Get single project by ID"},
  {group:"Admin Project",method:"POST",path:"/api/admin/project/update-project",auth:true,body:[
    {key:"id",type:"ObjectId",req:true},{key:"name",type:"string",req:false},{key:"description",type:"string",req:false},{key:"status",type:"string",req:false,hint:"active|completed|onHold"},{key:"dueDate",type:"date",req:false}
  ],query:[],params:[],desc:"Update a project"},
  {group:"Admin Project",method:"POST",path:"/api/admin/project/delete-projects",auth:true,body:[
    {key:"data",type:"array",req:true,hint:'["projectId1","projectId2"]'}

  {group:"Admin Project",method:"POST",path:"/api/admin/project/add-member",auth:true,body:[
    {key:"projectId",type:"ObjectId",req:true},{key:"userId",type:"ObjectId",req:true},{key:"organizationId",type:"ObjectId",req:true},{key:"role",type:"string",req:false,hint:"manager|developer|tester"}
  ],query:[],params:[],desc:"Add a member to a project"},
  {group:"Admin Project",method:"GET",path:"/api/admin/project/get-members",auth:true,body:[],query:[
    {key:"projectId",type:"ObjectId",req:true},{key:"page",type:"number",req:false},{key:"limit",type:"number",req:false},{key:"search",type:"string",req:false},{key:"role",type:"string",req:false,hint:"manager|developer|tester"}
  ],params:[],desc:"Get project members with pagination"},
  {group:"Admin Project",method:"GET",path:"/api/admin/project/get-member/:id",auth:true,body:[],query:[],params:[{key:"id",type:"ObjectId",req:true}],desc:"Get single project member by membership ID"},
  {group:"Admin Project",method:"PUT",path:"/api/admin/project/update-member/:id",auth:true,body:[
    {key:"role",type:"string",req:false,hint:"manager|developer|tester"},{key:"isActive",type:"boolean",req:false}
  ],query:[],params:[{key:"id",type:"ObjectId",req:true}],desc:"Update project member role or active status"},
  {group:"Admin Project",method:"POST",path:"/api/admin/project/remove-members",auth:true,body:[
    {key:"data",type:"array",req:true,hint:'["membershipId1","membershipId2"]'}
  ],query:[],params:[],desc:"Remove project member(s) — pass array of membership IDs in data field"},

  // ── ATTENDANCE ──
  {group:"Attendance",method:"POST",path:"/api/attendance/verify-mark-attendance",auth:true,body:[],query:[],params:[],desc:"Mark attendance with face recognition (multipart/form-data, field: frames[] — up to 5 image files)"},

  // ── USER AUTH ──
  {group:"User Auth",method:"POST",path:"/api/auth/register",auth:false,body:[
    {key:"name",type:"string",req:true},{key:"userEmail",type:"string",req:true},{key:"password",type:"string",req:true},{key:"organizationId",type:"ObjectId",req:true},{key:"role",type:"string",req:true,hint:"user"}
  ],query:[],params:[],desc:"Register a new user"},
  {group:"User Auth",method:"POST",path:"/api/auth/login",auth:false,body:[
    {key:"userEmail",type:"string",req:true},{key:"password",type:"string",req:true}

let activeRoute = null;
let currentTab = "body";

function buildSidebar() {
  const list = document.getElementById("route-list");
  const groups = {};
  ROUTES.forEach((r, i) => {
    if (!groups[r.group]) groups[r.group] = [];
    groups[r.group].push({ ...r, idx: i });
  });
  let html = "";
  for (const [name, routes] of Object.entries(groups)) {
    html += `<div class="route-group" data-group="${name}">
      <div class="route-group-header" onclick="toggleGroup(this)">
        <span class="arrow">▼</span> ${name} <span style="margin-left:auto;font-size:10px;color:var(--muted)">${routes.length}</span>
      </div>
      <div class="route-group-items">`;
    routes.forEach(r => {
      html += `<div class="route-item" data-idx="${r.idx}" onclick="selectRoute(${r.idx})">
        <span class="method-badge method-${r.method}">${r.method}</span>
        <span class="route-path" title="${r.path}">${r.path.replace(/^\/api/,'')}</span>
        <span class="auth-dot ${r.auth ? 'locked' : 'open'}" title="${r.auth ? 'Auth required' : 'Public'}"></span>
      </div>`;
    });
    html += `</div></div>`;
  }
  list.innerHTML = html;
}

function toggleGroup(el) {
  el.parentElement.classList.toggle("collapsed");
}

function filterRoutes(q) {
  q = q.toLowerCase();
  document.querySelectorAll(".route-item").forEach(el => {
    const r = ROUTES[el.dataset.idx];
    const match = r.path.toLowerCase().includes(q) || r.group.toLowerCase().includes(q) || r.method.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q);
    el.style.display = match ? "" : "none";
  });
  document.querySelectorAll(".route-group").forEach(g => {
    const visible = g.querySelectorAll(".route-item:not([style*='display: none'])").length;
    g.style.display = visible ? "" : "none";
    if (q && visible) g.classList.remove("collapsed");
  });
}

function selectRoute(idx) {
  activeRoute = ROUTES[idx];
  document.querySelectorAll(".route-item").forEach(el => el.classList.remove("active"));
  document.querySelector(`.route-item[data-idx="${idx}"]`).classList.add("active");
  document.getElementById("req-method").value = activeRoute.method;
  document.getElementById("req-url").value = activeRoute.path;
  currentTab = activeRoute.body.length ? "body" : activeRoute.query.length ? "query" : activeRoute.params.length ? "params" : "info";
  renderReqPanel();
  document.getElementById("response-body").innerHTML = '<span class="empty-state">Click Send to test this endpoint</span>';
  document.getElementById("resp-status").style.display = "none";
  document.getElementById("timer").textContent = "";
}

function switchReqTab(el) {
  currentTab = el.dataset.tab;
  el.parentElement.querySelectorAll(".panel-tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  renderReqPanel();
}

function renderReqPanel() {
  const panel = document.getElementById("req-body-panel");
  if (!activeRoute) { panel.innerHTML = '<span class="empty-state">Select a route from the sidebar</span>'; return; }

  if (currentTab === "info") {
    panel.innerHTML = `<div class="desc-block"><h3>${activeRoute.method} ${activeRoute.path}</h3><p>${activeRoute.desc}</p></div>
      <div class="desc-block"><h3>Authentication</h3><p>${activeRoute.auth ? '🔒 Requires accessToken cookie (login first)' : '🔓 Public — no auth needed'}</p></div>
      <div class="desc-block"><h3>Body fields: ${activeRoute.body.length}</h3><p>${activeRoute.body.map(f=>`<code>${f.key}</code>`).join(', ') || 'None'}</p></div>
      <div class="desc-block"><h3>Query params: ${activeRoute.query.length}</h3><p>${activeRoute.query.map(f=>`<code>${f.key}</code>`).join(', ') || 'None'}</p></div>
      <div class="desc-block"><h3>URL params: ${activeRoute.params.length}</h3><p>${activeRoute.params.map(f=>`<code>:${f.key}</code>`).join(', ') || 'None'}</p></div>`;
    return;
  }

  const fields = currentTab === "body" ? activeRoute.body : currentTab === "query" ? activeRoute.query : activeRoute.params;
  if (!fields.length) { panel.innerHTML = `<span class="empty-state">No ${currentTab} parameters for this route</span>`; return; }

  let html = `<p class="info-text">${currentTab === "body" ? "JSON body fields" : currentTab === "query" ? "Query string parameters" : "URL path parameters"}</p>`;
  fields.forEach(f => {
    const id = `field-${currentTab}-${f.key}`;
    html += `<div class="field-row">
      <span class="${f.req ? 'field-req' : 'field-opt'}">${f.req ? 'REQ' : 'OPT'}</span>
      <input class="field-key" value="${f.key}" readonly>
      <input class="field-val" id="${id}" placeholder="${f.hint || f.type}" data-type="${f.type}">
      <span class="field-type">${f.type}</span>
    </div>`;
  });
  panel.innerHTML = html;
}

function buildUrl() {
  const base = document.getElementById("base-url").value.replace(/\/$/,"");
  let path = activeRoute.path;

  // Replace URL params
  activeRoute.params.forEach(p => {
    const val = document.getElementById(`field-params-${p.key}`)?.value;
    if (val) path = path.replace(`:${p.key}`, val);
  });

  // Add query params
  const qp = [];
  activeRoute.query.forEach(q => {
    const val = document.getElementById(`field-query-${q.key}`)?.value;
    if (val) qp.push(`${encodeURIComponent(q.key)}=${encodeURIComponent(val)}`);
  });

  return base + path + (qp.length ? '?' + qp.join('&') : '');
}

function buildBody() {
  if (!activeRoute.body.length) return null;
  const obj = {};
  activeRoute.body.forEach(f => {
    const el = document.getElementById(`field-body-${f.key}`);
    if (!el) return;
    let val = el.value.trim();
    if (!val) return;
    if (f.type === "number") val = Number(val);
    else if (f.type === "array") { try { val = JSON.parse(val); } catch(e) { val = val.split(",").map(s=>s.trim()); } }
    else if (f.type === "boolean") val = val === "true";
    obj[f.key] = val;
  });
  return Object.keys(obj).length ? obj : null;
}

async function sendRequest() {
  if (!activeRoute) return;
  const btn = document.getElementById("send-btn");
  btn.disabled = true; btn.textContent = "...";
  const url = buildUrl();
  const body = buildBody();
  const method = activeRoute.method;

  const opts = {
    method,
    headers: { "Content-Type": "application/json" },
    credentials: "include",
  };
  if (body && method !== "GET") opts.body = JSON.stringify(body);

  const t0 = performance.now();
  try {
    const res = await fetch(url, opts);
    const elapsed = Math.round(performance.now() - t0);
    document.getElementById("timer").textContent = `${elapsed}ms`;

    const status = document.getElementById("resp-status");
    status.textContent = `${res.status} ${res.statusText}`;
    status.className = `status-badge ${res.status < 300 ? 'status-2xx' : res.status < 500 ? 'status-4xx' : 'status-5xx'}`;
    status.style.display = "";

    let text;
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("json")) {
      const json = await res.json();
      text = JSON.stringify(json, null, 2);
    } else {
      text = await res.text();
    }
    document.getElementById("response-body").textContent = text;
  } catch (err) {
    document.getElementById("timer").textContent = "";
    const status = document.getElementById("resp-status");
    status.textContent = "ERROR";
    status.className = "status-badge status-5xx";
    status.style.display = "";
    document.getElementById("response-body").textContent = `Network Error:\n${err.message}\n\nMake sure the server is running at ${document.getElementById("base-url").value}`;
  }
  btn.disabled = false; btn.textContent = "Send";
}

document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") sendRequest(); });
buildSidebar();
</script>
