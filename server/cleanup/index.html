<!DOCTYPE html>
<html>
<head>
  <title>Upload Excel File</title>
</head>
<body>

<h2>Upload Excel File</h2>

<form id="excelForm">
  <input
          type="file"
          id="excelFile"
          name="file"
          accept=".xls,.xlsx"
          required
  />
  <br><br>
  <button type="submit">Upload</button>
</form>

<p id="message"></p>

<script>
  const form = document.getElementById("excelForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fileInput = document.getElementById("excelFile");
    const file = fileInput.files[0];

    if (!file) {
      alert("Please select a file");
      return;
    }

    const formData = new FormData();
    formData.append("file", file); // must match multer field name

    try {
      const response = await fetch("http://localhost:5000/api/admin/add-employees/by-excel", {
        method: "POST",
        body: formData
        // ❌ DO NOT set Content-Type manually
      });

      const data = await response.json();

      if (response.ok) {
        document.getElementById("message").innerText = "Upload successful!";
        console.log(data);
      } else {
        document.getElementById("message").innerText = "Upload failed!";
        console.error(data);
      }

    } catch (error) {
      document.getElementById("message").innerText = "Error connecting to server!";
      console.error(error);
    }
  });
</script>

</body>
</html>
